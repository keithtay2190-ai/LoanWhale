name: Keep Supabase project awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_ANON_KEY secret is empty or missing"
            exit 1
          fi
          echo "Key length: ${#SUPABASE_ANON_KEY} characters"
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "https://pgxbwwdvfndyndnzyhsx.supabase.co/rest/v1/loans?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/body.txt
          if [ "$code" -ge 400 ]; then
            exit 1
          fi
